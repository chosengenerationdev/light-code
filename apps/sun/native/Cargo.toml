[package]
name = "fire-code"
version = "0.10.0"
edition = "2021"
rust-version = "1.86"
description = "Fire Code: several codebases, each with its own Light Code agent, in one Windows window"
license = "MIT"
publish = false

[[bin]]
name = "fire-code"
path = "src/main.rs"

# The parallel file helper the agents call: find, summarise, read many, big files, tables.
[[bin]]
name = "fire-fs"
path = "src/bin/fire_fs.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
tauri-winrt-notification = "0.8"
winreg = "0.56"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
ignore = "=0.4.23"
rayon = "1"
regex = "1"
memchr = "2"
csv = "1"
calamine = "0.26"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
