[package]
name = "fire-code"
version = "0.77.0"
edition = "2021"
rust-version = "1.86"
description = "Fire Code: several codebases, each with its own Light Code agent, in one Windows window"
license = "MIT"
publish = false
# src/bin/fire_fs.rs belongs to the fire-fs package (below); without this Cargo would also build it here.
autobins = false

[[bin]]
name = "fire-code"
path = "src/main.rs"

# The parallel file helper the agents call (find, summarise, read many, big files, tables, SQLite,
# dataframes) is its own package, `fire-fs/`, in this workspace. It holds Polars, and as a second
# binary of this package every Fire Code version bump rebuilt it with link-time optimisation - about
# eight minutes - though nothing in it had changed. Now it rebuilds only when its own code does.
[workspace]
members = ["fire-fs"]
default-members = [".", "fire-fs"]
resolver = "2"

[dependencies]
tao = "0.37"
wry = "0.57"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
window-vibrancy = "0.8"
tauri-winrt-notification = "0.8"
winreg = "0.56"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
# Monitoring's `matches` rule. Already in the lock through fire-fs.
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Security_Cryptography",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_IO",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Networking_Ldap",
  # GetLocalTime/GetSystemTime: monitoring's active hours and local timestamps.
  "Win32_System_SystemInformation",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
# Thin LTO and parallel codegen since Polars joined fire-fs (0.16.0): full LTO with one codegen unit took
# 45 minutes for the helper alone, paid on every release, for a few percent of speed.
lto = "thin"
codegen-units = 16
strip = true
panic = "abort"
