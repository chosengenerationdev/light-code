[package]
name = "sun-light-code"
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
description = "Sun Light Code: several codebases, each with its own Light Code agent, in one Windows window"
license = "MIT"
publish = false

[[bin]]
name = "sun-light-code"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8"
tauri-winrt-notification = "0.8"
winreg = "0.56"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_ProcessStatus",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
