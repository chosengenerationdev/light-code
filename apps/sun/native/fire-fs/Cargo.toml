[package]
name = "fire-fs"
# Its own version, deliberately not Fire Code's. Every Fire Code release bumps that number, and while the
# helper was a second binary of the same package each bump rebuilt it - Polars and link-time optimisation
# included - though nothing in it had changed. Raise this only when the helper itself changes.
version = "1.0.0"
edition = "2021"
rust-version = "1.86"
description = "fire-fs: the parallel file, table and SQLite helper Light Code and Fire Code call"
license = "MIT"
publish = false

# The source stays in the window's tree: it shares files there by path (`#[path]`), and nothing moved.
[[bin]]
name = "fire-fs"
path = "../src/bin/fire_fs.rs"

# `dataframe` is the one heavy operation: Polars is ~40 MB of the helper's ~45 MB. Fire Code ships it;
# the VS Code extension carries a slim helper built with `--no-default-features`, which has every
# other operation and reports exactly those in `capabilities`.
[features]
default = ["dataframe"]
dataframe = ["dep:polars"]

[dependencies]
serde_json = "1"
sha2 = "0.10"
ignore = "=0.4.23"
rayon = "1"
regex = "1"
memchr = "2"
csv = "1"
calamine = "0.26"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate-flate2"] }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
polars = { version = "=0.49", optional = true, default-features = false, features = ["lazy", "sql", "csv", "strings", "temporal", "dtype-date", "dtype-datetime", "round_series", "is_in"] }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_Networking_Ldap",
] }

# The same icon and manifest the helper always had (UTF-8 code page among them).
[build-dependencies]
embed-resource = "3"
