<svg xmlns="http://www.w3.org/2000/svg" width="700" height="406" viewBox="0 0 700 406" role="img"><rect x="0" y="0" width="700" height="406" rx="0" fill="#1f1f1f"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#282828"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#282828"/><line x1="0" y1="70" x2="700" y2="70" stroke="#3d3d3d"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Python</text><rect x="435.80000000000007" y="44" width="46.5" height="22" rx="11" fill="#4caf7d"/><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#10261a" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Everything it can call right now, in one list — built in, from MCP, and your own Python tools.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Search</text><rect x="250" y="114" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="129" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">read a spreadsheet</text><text x="20" y="143" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Matches descriptions too, so you can look for what you want done.</text><text x="20" y="170" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">BUILT IN</text><line x1="20" y1="178" x2="680" y2="178" stroke="#3d3d3d"/><text x="20" y="207" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">read_file · apply_diff · execute_command</text><rect x="250" y="192" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="207" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">the nine that always exist</text><text x="20" y="234" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">MCP SERVERS</text><line x1="20" y1="242" x2="680" y2="242" stroke="#3d3d3d"/><text x="20" y="271" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">filesystem__read_file</text><rect x="250" y="258" width="31.4" height="18" rx="9" fill="#343434"/><text x="265.7" y="271" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">mcp</text><rect x="287.4" y="258" width="72" height="18" rx="9" fill="#343434"/><text x="323.4" y="271" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">filesystem</text><rect x="365.4" y="258" width="66.19999999999999" height="18" rx="9" fill="#343434"/><text x="398.5" y="271" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">looked up</text><text x="20" y="298" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">PYTHON TOOLS</text><line x1="20" y1="306" x2="680" y2="306" stroke="#3d3d3d"/><text x="20" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">py__parse_report</text><rect x="250" y="322" width="43" height="18" rx="9" fill="#343434"/><text x="271.5" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">edits</text><rect x="299" y="322" width="66.19999999999999" height="18" rx="9" fill="#343434"/><text x="332.1" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">looked up</text><text x="20" y="365" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">“looked up” means hidden from the prompt</text><rect x="250" y="350" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="365" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">still callable — it finds it first</text><text x="20" y="379" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">The default. A shorter prompt is not a shorter tool list — withholding a capability is what Approvals is for.</text></svg>
