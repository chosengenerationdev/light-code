<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img"><rect x="0" y="0" width="700" height="470" rx="0" fill="#1f1f1f"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#282828"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#282828"/><line x1="0" y1="70" x2="700" y2="70" stroke="#3d3d3d"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Schedules</text><rect x="380.20000000000005" y="44" width="52.599999999999994" height="22" rx="11" fill="#4caf7d"/><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#10261a" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">The assistant can write its own tools in Python. The sharpest surface in the product, so read the approval.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Enabled</text><rect x="250" y="117" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="125" r="5.5" fill="#9a9a9a"/><text x="286" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Path to uv</text><rect x="250" y="144" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="159" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">detected</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">uv installs dependencies and manages the environment.</text><text x="20" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Python environment</text><rect x="250" y="188" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">the project’s .venv</text><path d="M664 197 l4 5 l4 -5" stroke="#9a9a9a" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Your own venv is preferred — it is where your internal libraries already are.</text><text x="20" y="247" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Where tools are kept</text><rect x="250" y="232" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="247" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">.lightcode/tools</text><text x="20" y="261" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Inside the workspace, so a new tool lands in git and gets reviewed.</text><text x="20" y="291" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Package index</text><rect x="250" y="276" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="291" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">https://pypi.internal/simple</text><text x="20" y="305" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Or refuse the network entirely.</text><text x="20" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Timeout per call</text><rect x="250" y="320" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="335" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">60</text><text x="20" y="362" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">THE TOOLS IT WROTE</text><line x1="20" y1="370" x2="680" y2="370" stroke="#3d3d3d"/><text x="20" y="399" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">py__parse_report</text><rect x="250" y="386" width="37.2" height="18" rx="9" fill="#343434"/><text x="268.6" y="399" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Open</text><rect x="293.2" y="386" width="48.8" height="18" rx="9" fill="#343434"/><text x="317.59999999999997" y="399" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Delete</text><text x="20" y="429" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Approval is by content hash</text><rect x="250" y="414" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="429" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">edited outside? refused, and reported</text><text x="20" y="443" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Creating one always prompts, and always shows the whole source.</text></svg>
