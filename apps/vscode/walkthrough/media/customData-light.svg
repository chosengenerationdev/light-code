"210" width="37.2" height="18" rx="9" fill="#e4e4e4"/><text x="444.6" y="223" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#1f1f1f" text-anchor="middle" opacity="1">Edit</text><text x="20" y="253" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1"></text><rect x="250" y="238" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="253" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">310 records · confluence__search · only when I ask</text><text x="20" y="267" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">A schedule is the wrong shape for a source that is expensive, or that only changes when somebody does something.</text><text x="20" y="294" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1">EACH DATASET</text><line x1="20" y1="302" x2="680" y2="302" stroke="#d0d0d0"/><text x="20" y="331" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Collector</text><rect x="250" y="316" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="331" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">a Python tool or an MCP tool</text><text x="20" y="345" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">It returns records with a stable id — that is what makes a re-sync an update rather than a duplication.</text><text x="20" y="375" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Keep records for</text><rect x="250" y="360" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="375" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">90 days</text><text x="20" y="389" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Applied on every sync, to records whose collector gave them a timestamp.</text><text x="20" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Ask the assistant to write one</text><rect x="250" y="404" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">it already knows the contract</text></svg>
