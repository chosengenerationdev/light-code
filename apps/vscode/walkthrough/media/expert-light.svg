<svg xmlns="http://www.w3.org/2000/svg" width="700" height="490" viewBox="0 0 700 490" role="img"><rect x="0" y="0" width="700" height="490" rx="0" fill="#f8f8f8"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#ececec"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#ececec"/><line x1="0" y1="70" x2="700" y2="70" stroke="#d0d0d0"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Search</text><rect x="250.70000000000002" y="44" width="52.599999999999994" height="22" rx="11" fill="#2f7d4f"/><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">A cheap model does the work and consults Claude on the hard parts. Off until you enable it.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Enabled</text><rect x="250" y="117" width="28" height="16" rx="8" fill="#e4e4e4" stroke="#c8c8c8" stroke-width="1"/><circle cx="258" cy="125" r="5.5" fill="#6b6b6b"/><text x="286" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">off</text><text x="20" y="143" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Nothing is spawned and nothing is spent until this is on.</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Command</text><rect x="250" y="158" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="173" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">claude</text><text x="20" y="187" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Found on PATH, or via npm, or point at it yourself if detection fails.</text><text x="20" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Model (optional)</text><rect x="250" y="202" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">default</text><path d="M664 211 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="244" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1">BUDGET PER TASK</text><line x1="20" y1="252" x2="680" y2="252" stroke="#d0d0d0"/><text x="20" y="281" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Maximum spend per task</text><rect x="250" y="266" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="281" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">$1.00</text><text x="20" y="295" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Also adjustable mid-task from the chat header.</text><text x="20" y="325" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Maximum consultations per task</text><rect x="250" y="310" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="325" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">6</text><text x="20" y="355" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Cost estimate</text><rect x="250" y="340" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="355" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">the expert prices a task before starting it</text><text x="20" y="385" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Skill assessment</text><rect x="250" y="370" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="385" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">how the expert rates your primary model</text><text x="20" y="412" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1">WHAT IT MAY DO</text><line x1="20" y1="420" x2="680" y2="420" stroke="#d0d0d0"/><text x="20" y="449" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Read, Grep, Glob only</text><rect x="250" y="434" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="449" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">it can never edit or run anything</text><text x="20" y="463" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">A second agent editing your repo would sit outside the approval gate entirely.</text></svg>
