<svg xmlns="http://www.w3.org/2000/svg" width="700" height="518" viewBox="0 0 700 518" role="img"><rect x="0" y="0" width="700" height="518" rx="0" fill="#f8f8f8"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#ececec"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#ececec"/><line x1="0" y1="70" x2="700" y2="70" stroke="#d0d0d0"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Tools</text><text x="514.6500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Outlook</text><text x="588.5500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Custom data</text><text x="659.4000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Skills</text><text x="718.0500000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Network</text><text x="788.9000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Specialists your assistant consults while it works. Assign a model to a role and it is offered.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Expert</text><rect x="250" y="114" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Claude (command line)</text><path d="M664 123 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="143" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Detected automatically, and the default here — but any model can take the seat.</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Programmer</text><rect x="250" y="158" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Nobody</text><path d="M664 167 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Reviewer</text><rect x="250" y="188" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Corporate gateway</text><path d="M664 197 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Reads a finished change and says what is wrong with it.</text><text x="20" y="247" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Tester</text><rect x="250" y="232" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="247" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Nobody</text><path d="M664 241 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="277" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Librarian</text><rect x="250" y="262" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="277" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Nobody</text><path d="M664 271 l4 5 l4 -5" stroke="#6b6b6b" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="291" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Skills, internal docs and house conventions.</text><text x="20" y="321" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Prompt</text><rect x="250" y="306" width="57.2" height="22" rx="4" fill="#2f7d4f"/><text x="278.6" y="321" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="1">Prompt</text><text x="20" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">What each specialist is told it is. Edit it to suit this codebase.</text><text x="20" y="362" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1">COST</text><line x1="20" y1="370" x2="680" y2="370" stroke="#d0d0d0"/><text x="20" y="399" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">What consultations cost is worth managing</text><rect x="250" y="387" width="28" height="16" rx="8" fill="#e4e4e4" stroke="#c8c8c8" stroke-width="1"/><circle cx="258" cy="395" r="5.5" fill="#6b6b6b"/><text x="286" y="399" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">off</text><text x="20" y="413" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Only a Claude consultation reports a price, so a budget is shown only where one applies.</text><text x="20" y="440" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#6b6b6b" text-anchor="start" opacity="1">WHEN TO CONSULT</text><line x1="20" y1="448" x2="680" y2="448" stroke="#d0d0d0"/><text x="20" y="477" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Consulting advice</text><rect x="250" y="462" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="477" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">editable — the roster of who exists is added automatically</text><text x="20" y="491" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">The assistant consults on its own; this is its judgement about when that is worth it.</text></svg>
