<svg xmlns="http://www.w3.org/2000/svg" width="700" height="510" viewBox="0 0 700 510" role="img"><rect x="0" y="0" width="700" height="510" rx="0" fill="#1f1f1f"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#282828"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#282828"/><line x1="0" y1="70" x2="700" y2="70" stroke="#3d3d3d"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Providers</text><rect x="83.9" y="44" width="70.9" height="22" rx="11" fill="#4caf7d"/><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#10261a" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Nothing here is on by default. This tab is where standing permission is granted — and taken back.</text><text x="20" y="126" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">SKIP THE PROMPT FOR</text><line x1="20" y1="134" x2="680" y2="134" stroke="#3d3d3d"/><text x="20" y="163" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Reading files</text><rect x="250" y="151" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="159" r="5.5" fill="#9a9a9a"/><text x="286" y="163" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="193" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Editing files</text><rect x="250" y="181" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="189" r="5.5" fill="#9a9a9a"/><text x="286" y="193" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="223" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Running commands</text><rect x="250" y="211" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="219" r="5.5" fill="#9a9a9a"/><text x="286" y="223" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="253" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">MCP tools</text><rect x="250" y="241" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="249" r="5.5" fill="#9a9a9a"/><text x="286" y="253" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="280" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">STANDING GRANTS, REVOCABLE</text><line x1="20" y1="288" x2="680" y2="288" stroke="#3d3d3d"/><text x="20" y="317" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Always-allowed commands</text><rect x="250" y="302" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="317" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">npm test   ✕</text><text x="20" y="331" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Exact match, byte for byte. "npm test" never covers "npm test &amp;&amp; rm -rf /".</text><text x="20" y="361" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Always-allowed tools</text><rect x="250" y="346" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="361" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">filesystem__read_file   ✕</text><text x="20" y="391" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Folders outside the workspace</text><rect x="250" y="376" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="391" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">\\nas\shared   ✕</text><text x="20" y="405" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Granted in the chat when a read is refused, listed here so you can take it back.</text><text x="20" y="432" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">LIMITS</text><line x1="20" y1="440" x2="680" y2="440" stroke="#3d3d3d"/><text x="20" y="469" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Maximum steps per message</text><rect x="250" y="454" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="469" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">25</text><text x="20" y="483" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">How many tool calls one message may take before it stops and asks.</text></svg>
