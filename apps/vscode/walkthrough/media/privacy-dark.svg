<svg xmlns="http://www.w3.org/2000/svg" width="640" height="324" viewBox="0 0 640 324" role="img"><rect x="0" y="0" width="640" height="324" rx="0" fill="#1f1f1f"/><rect x="20" y="20" width="190" height="130" rx="6" fill="#282828" stroke="#3d3d3d" stroke-width="1"/><text x="115" y="46" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="12" font-weight="700" fill="#e8e8e8" text-anchor="middle" opacity="1">This machine</text><rect x="38" y="60" width="154" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="48" y="75" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Your files</text><rect x="38" y="88" width="154" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="48" y="103" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Your commands</text><rect x="38" y="116" width="154" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="48" y="131" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Your secrets</text><path d="M212 85 C 250 85, 250 42, 288 42" stroke="#4caf7d" stroke-width="1.4" fill="none"/><circle cx="290" cy="42" r="3" fill="#4caf7d"/><rect x="300" y="24" width="320" height="36" rx="4" fill="#2f2f2f" stroke="#4caf7d" stroke-width="1"/><text x="312" y="40" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Your model gateway</text><text x="312" y="53" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">the profile you configured</text><path d="M212 85 C 250 85, 250 86, 288 86" stroke="#4caf7d" stroke-width="1.4" fill="none"/><circle cx="290" cy="86" r="3" fill="#4caf7d"/><rect x="300" y="68" width="320" height="36" rx="4" fill="#2f2f2f" stroke="#4caf7d" stroke-width="1"/><text x="312" y="84" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Your MCP servers</text><text x="312" y="97" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">only the ones you added</text><path d="M212 85 C 250 85, 250 130, 288 130" stroke="#e06c56" stroke-width="1.4" fill="none"/><circle cx="290" cy="130" r="3" fill="#e06c56"/><rect x="300" y="112" width="320" height="36" rx="4" fill="#2f2f2f" stroke="#e06c56" stroke-width="1"/><text x="312" y="128" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Your vector store</text><text x="312" y="141" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">only if you enable Search</text><path d="M212 85 C 250 85, 250 174, 288 174" stroke="#e06c56" stroke-width="1.4" fill="none"/><circle cx="290" cy="174" r="3" fill="#e06c56"/><rect x="300" y="156" width="320" height="36" rx="4" fill="#2f2f2f" stroke="#e06c56" stroke-width="1"/><text x="312" y="172" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Your embedding endpoint</text><text x="312" y="185" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">sees the files you index</text><path d="M28 174 l4 4 l7 -9" stroke="#4caf7d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="178" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">No telemetry, ever</text><path d="M28 194 l4 4 l7 -9" stroke="#4caf7d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="198" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">No update checks</text><path d="M28 214 l4 4 l7 -9" stroke="#4caf7d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="218" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">No default endpoints — a fresh install contacts nothing</text><path d="M28 234 l4 4 l7 -9" stroke="#4caf7d" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="48" y="238" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">No remote assets in the panel</text><rect x="20" y="264" width="600" height="46" rx="4" fill="none" stroke="#e06c56" stroke-width="1" stroke-dasharray="4 3"/><text x="34" y="284" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="700" fill="#e06c56" text-anchor="start" opacity="1">Not sandboxed.</text><text x="132" y="284" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Commands, Python tools and MCP servers run as you,</text><text x="34" y="299" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">with your permissions. Approval is the boundary — that is why it is per-invocation.</text></svg>
