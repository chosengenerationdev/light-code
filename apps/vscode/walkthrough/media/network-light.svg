<svg xmlns="http://www.w3.org/2000/svg" width="700" height="406" viewBox="0 0 700 406" role="img"><rect x="0" y="0" width="700" height="406" rx="0" fill="#f8f8f8"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#ececec"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#ececec"/><line x1="0" y1="70" x2="700" y2="70" stroke="#d0d0d0"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Skills</text><rect x="540.9000000000001" y="44" width="58.699999999999996" height="22" rx="11" fill="#2f7d4f"/><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Trust and identity for every connection: gateway, token endpoint, MCP over HTTP, vector store, embedder.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Certificate directory</text><rect x="250" y="114" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="129" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">C:\certs</text><text x="20" y="143" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Filenames resolve against it. Must sit outside the workspace.</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">CA certificate</text><rect x="250" y="158" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="173" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">corporate-root.pem</text><text x="20" y="187" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Added to the public roots, not swapped for them.</text><text x="20" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Certificate</text><rect x="250" y="202" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="217" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">client.crt</text><text x="20" y="231" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">How the gateway identifies you. Taken as a pair with the key.</text><text x="20" y="261" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Private key</text><rect x="250" y="246" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="261" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">client.key</text><text x="20" y="291" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">PFX bundle</text><rect x="250" y="276" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="291" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">instead of the two above</text><text x="20" y="305" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">What corporate Windows PKI usually issues.</text><text x="20" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Key passphrase</text><rect x="250" y="320" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="335" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Set — replace?</text><text x="20" y="365" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Verify TLS certificates</text><rect x="250" y="353" width="28" height="16" rx="8" fill="#2f7d4f" stroke="#2f7d4f" stroke-width="1"/><circle cx="270" cy="361" r="5.5" fill="#ffffff"/><text x="286" y="365" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">on</text><text x="20" y="379" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Turning it off lets an interceptor read the traffic, key included. Add the CA instead.</text></svg>
