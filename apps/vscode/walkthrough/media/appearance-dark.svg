400" fill="#e8e8e8" text-anchor="middle" opacity="1">amber</text><text x="20" y="143" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Text on it is computed, so it stays readable whatever you pick.</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Expert colour</text><rect x="250" y="160" width="48.8" height="18" rx="9" fill="#343434"/><text x="274.4" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">violet</text><rect x="304.8" y="160" width="37.2" height="18" rx="9" fill="#343434"/><text x="323.40000000000003" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">teal</text><rect x="348" y="160" width="37.2" height="18" rx="9" fill="#343434"/><text x="366.6" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">rose</text><text x="20" y="187" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Marks authorship: text in this colour is Claude’s words, not your model’s.</text><text x="20" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Reduced motion</text><rect x="250" y="205" width="28" height="16" rx="8" fill="#343434" stroke="#484848" stroke-width="1"/><circle cx="258" cy="213" r="5.5" fill="#9a9a9a"/><text x="286" y="217" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">off</text><text x="20" y="231" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Also honoured automatically from your OS setting.</text></svg>
