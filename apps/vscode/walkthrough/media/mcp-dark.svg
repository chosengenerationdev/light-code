ity="1">  read_file</text><rect x="250" y="146" width="48.8" height="18" rx="9" fill="#343434"/><text x="274.4" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Always</text><rect x="304.8" y="146" width="31.4" height="18" rx="9" fill="#343434"/><text x="320.5" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Ask</text><rect x="342.2" y="146" width="43" height="18" rx="9" fill="#343434"/><text x="363.7" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Never</text><text x="20" y="173" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Per tool, not just per server: one server can expose forty.</text><text x="20" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">  write_file</text><rect x="250" y="190" width="48.8" height="18" rx="9" fill="#343434"/><text x="274.4" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Always</text><rect x="304.8" y="190" width="31.4" height="18" rx="9" fill="#343434"/><text x="320.5" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Ask</text><rect x="342.2" y="190" width="43" height="18" rx="9" fill="#343434"/><text x="363.7" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Never</text><text x="20" y="233" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">github</text><rect x="250" y="220" width="101" height="18" rx="9" fill="#343434"/><text x="300.5" y="233" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">failed to start</text><rect x="357" y="220" width="54.6" height="18" rx="9" fill="#343434"/><text x="384.3" y="233" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Restart</text><text x="20" y="263" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Configuration</text><rect x="250" y="248" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="263" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">{ "mcpServers": { … } }</text><text x="20" y="277" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">stdio or HTTP, inferred from whether you gave a command or a url.</text><text x="20" y="307" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Secrets in env</text><rect x="250" y="292" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="307" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">${secret:GITHUB_TOKEN}</text><text x="20" y="321" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Resolved from the keychain at spawn time, never written into the file.</text></svg>
