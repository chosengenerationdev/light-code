<svg xmlns="http://www.w3.org/2000/svg" width="700" height="476" viewBox="0 0 700 476" role="img"><rect x="0" y="0" width="700" height="476" rx="0" fill="#1f1f1f"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#282828"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#9a9a9a" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#e8e8e8" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#282828"/><line x1="0" y1="70" x2="700" y2="70" stroke="#3d3d3d"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Expert</text><rect x="306.3" y="44" width="70.9" height="22" rx="11" fill="#4caf7d"/><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#10261a" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Tools</text><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Prompts that run on their own, in the background, without disturbing the chat you are in.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Name</text><rect x="250" y="114" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="129" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">morning triage</text><text x="20" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Prompt</text><rect x="250" y="144" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="159" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">summarise failing tests</text><text x="20" y="189" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Minutes between runs</text><rect x="250" y="174" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="189" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">60</text><text x="20" y="203" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Or a time of day. Runs even with the panel closed.</text><text x="20" y="230" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">WHAT AN UNATTENDED RUN MAY DO</text><line x1="20" y1="238" x2="680" y2="238" stroke="#3d3d3d"/><text x="20" y="267" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Workspace files</text><rect x="250" y="252" width="430" height="22" rx="4" fill="#2f2f2f" stroke="#484848" stroke-width="1"/><text x="258" y="267" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">read only</text><path d="M664 261 l4 5 l4 -5" stroke="#9a9a9a" stroke-width="1.4" fill="none" stroke-linecap="round"/><text x="20" y="281" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Nobody is there to approve anything, so editing is granted here or not at all.</text><text x="20" y="311" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Filter tools</text><rect x="250" y="296" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="311" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">pick exactly which tools it may call</text><text x="20" y="341" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Creating Python tools or skills</text><rect x="250" y="326" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="341" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">never available to a schedule</text><text x="20" y="355" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">Model-authored code with no one watching is the one thing that stays out of reach.</text><text x="20" y="382" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="9" font-weight="700" fill="#9a9a9a" text-anchor="start" opacity="1">AFTERWARDS</text><line x1="20" y1="390" x2="680" y2="390" stroke="#3d3d3d"/><text x="20" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">Run history</text><rect x="250" y="406" width="54.6" height="18" rx="9" fill="#343434"/><text x="277.3" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Run now</text><rect x="310.6" y="406" width="101" height="18" rx="9" fill="#343434"/><text x="361.1" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Open transcript</text><rect x="417.6" y="406" width="48.8" height="18" rx="9" fill="#343434"/><text x="442" y="419" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#e8e8e8" text-anchor="middle" opacity="1">Delete</text><text x="20" y="449" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#e8e8e8" text-anchor="start" opacity="1">notify</text><rect x="250" y="434" width="430" height="22" rx="4" fill="none" stroke="#484848" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="449" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start" opacity="1">a toast when a run has something to say</text></svg>
