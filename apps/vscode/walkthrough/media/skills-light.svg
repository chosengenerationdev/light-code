<svg xmlns="http://www.w3.org/2000/svg" width="700" height="334" viewBox="0 0 700 334" role="img"><rect x="0" y="0" width="700" height="334" rx="0" fill="#f8f8f8"/><rect x="0" y="0" width="700" height="40" rx="0" fill="#ececec"/><path d="M20 20 l7 -7 M20 20 l7 7" stroke="#6b6b6b" stroke-width="1.6" fill="none" stroke-linecap="round"/><text x="38" y="25" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="13" font-weight="600" fill="#1f1f1f" text-anchor="start" opacity="1">Settings</text><rect x="0" y="40" width="700" height="30" rx="0" fill="#ececec"/><line x1="0" y1="70" x2="700" y2="70" stroke="#d0d0d0"/><text x="45.45" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Providers</text><text x="119.35000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Approvals</text><text x="174.95000000000002" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">MCP</text><text x="221.40000000000003" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Search</text><text x="277" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Expert</text><text x="341.75" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Schedules</text><text x="406.50000000000006" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Python</text><text x="459.05000000000007" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Tools</text><rect x="485.30000000000007" y="44" width="52.599999999999994" height="22" rx="11" fill="#2f7d4f"/><text x="511.6" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="1">Skills</text><text x="570.2500000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Network</text><text x="641.1000000000001" y="59" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle" opacity="1">Appearance</text><text x="20" y="92" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">Markdown notes that teach it your conventions. Only the name and description cost prompt space.</text><text x="20" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">internal-http-client</text><rect x="250" y="116" width="37.2" height="18" rx="9" fill="#e4e4e4"/><text x="268.6" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#1f1f1f" text-anchor="middle" opacity="1">Open</text><rect x="293.2" y="116" width="48.8" height="18" rx="9" fill="#e4e4e4"/><text x="317.59999999999997" y="129" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#1f1f1f" text-anchor="middle" opacity="1">Delete</text><text x="20" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">release-process</text><rect x="250" y="146" width="37.2" height="18" rx="9" fill="#e4e4e4"/><text x="268.6" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#1f1f1f" text-anchor="middle" opacity="1">Open</text><rect x="293.2" y="146" width="48.8" height="18" rx="9" fill="#e4e4e4"/><text x="317.59999999999997" y="159" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#1f1f1f" text-anchor="middle" opacity="1">Delete</text><text x="20" y="189" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Where skills are written</text><rect x="250" y="174" width="430" height="22" rx="4" fill="#ffffff" stroke="#c8c8c8" stroke-width="1"/><text x="258" y="189" font-family="ui-monospace,'Cascadia Code','Consolas',monospace" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">.lightcode/skills</text><text x="20" y="219" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Extra folders to read</text><rect x="250" y="204" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="219" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">a shared team folder, read-only</text><text x="20" y="233" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">PATH-style precedence; a shadowed skill is reported, not silently dropped.</text><text x="20" y="263" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Problems</text><rect x="250" y="248" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="263" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">a file missing its frontmatter is named here</text><text x="20" y="293" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" opacity="1">Writing one needs approval</text><rect x="250" y="278" width="430" height="22" rx="4" fill="none" stroke="#c8c8c8" stroke-width="1" stroke-dasharray="3 3"/><text x="258" y="293" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">you see the full text first</text><text x="20" y="307" font-family="system-ui,'Segoe UI',Ubuntu,sans-serif" font-size="10" font-weight="400" fill="#6b6b6b" text-anchor="start" opacity="1">A skill is prose that steers every future turn, so it is never written silently.</text></svg>
