# The platform to build and test against. 2023.2 is the floor: JCEF has shipped since 2020.2,
# but the IntelliJ Platform Gradle Plugin 2.x used here expects a reasonably recent SDK.
platformType = IC
platformVersion = 2023.2.5

pluginGroup = dev.chosengeneration.lightcode
pluginName = Light Code
pluginVersion = 0.1.0

# The oldest and newest IDE builds this declares itself compatible with. 232 is 2023.2.
pluginSinceBuild = 232
pluginUntilBuild = 251.*

org.gradle.jvmargs = -Xmx2048m
kotlin.stdlib.default.dependency = false
